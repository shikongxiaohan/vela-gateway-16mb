; PlatformIO Project Configuration File
;
; Vela Gateway — ESP32 手表网络网关（16MB Flash）
;
; espidf + arduino 双框架：sdkconfig 真正参与编译，BT / Wi-Fi / lwIP 的
; 低内存参数才会生效（纯 arduino 环境只能用预编译库，改不了这些）。
;

[env]
; 构建前自动递进版本号 + 构建后自动修复 otadata、校验镜像、生成带版本号的产物。
;   pre:tools/pio_version.py   —— 编译前递增修订号（唯一真源：根目录 version.txt）
;   pre:tools/pio_verify.py    —— 构建后修 otadata、跑回归测试、出 factory/ota
; espidf+arduino 双框架下 PlatformIO 可能产出全 0xFF 的 ota_data_initial.bin，
; 而本项目分区表没有 factory 分区，bootloader 读不到 otadata 记录就会
; 每 2 秒复位一次（烧录工具却显示成功）。钩子会在构建后自动修正并校验。
; 手动触发：pio run -e yd_esp32_16mb -t check-images
extra_scripts =
  pre:tools/pio_version.py
  pre:tools/pio_verify.py

; 必须锁版本：espressif32 6.9+ 内置 Arduino core 3.x / ESP-IDF 5.x，
; 本项目用的是 Arduino 2.x + IDF 4.4 的 API（spi_flash_write、esp_spi_flash.h、
; WiFi.useStaticBuffers 等），装最新平台会直接编译失败。
; 6.1.0 = Arduino core 2.0.7 +（默认）ESP-IDF 5.0.1。
platform = espressif32@6.1.0
; 监视器波特率要和固件里的 VELA_SERIAL_BAUD 保持一致（默认 921600）。
; 想用 2000000 满速：下面改成 2000000，并在 build_flags 加 -DVELA_SERIAL_BAUD=2000000。
; 注意网页版串口监视器最高只到 921600，选不了 2000000。
monitor_speed = 921600
; ⚠️ 关键：6.1.0 平台默认拉 IDF 5.0.1，而 Arduino core 2.0.7 的 CMakeLists
; 硬性要求 IDF 4.4.x（"between 4.4.0 and 4.4.99"），不锁这一行 CMake 配置阶段
; 就会 FATAL_ERROR。3.40404.0 = ESP-IDF v4.4.4，是 6.1.0 的 optionalVersions。
platform_packages =
  platformio/framework-espidf @ 3.40404.0
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
  sh123/esp32_opus
  olikraus/U8g2 @ ^2.36.12

; ---------------------------------------------------------------------------
; 16MB Flash（YD-ESP32-B，ESP32-WROVER-E N16R8）
;   - 分区表：6MB + 6MB 双 OTA，3.875MB SPIFFS
;   - PSRAM 关闭：兼容任何 16MB Flash 的 ESP32（WROOM-32E / WROVER）
;   - 首次换分区表需 USB 整片擦除后刷写（见 docs/刷写.md）
; ---------------------------------------------------------------------------
[env:yd_esp32_16mb]
board = upesy_wroom
framework = espidf, arduino
board_build.partitions = partitions_ota_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
lib_ignore = AsyncUDP
build_flags =
  -Wno-error
  -Wno-error=maybe-uninitialized
  -Wno-error=unused-variable
  -Wno-error=unused-function
  -Wno-maybe-uninitialized
  -DIP_NAPT_MAX=16
  -DIP_PORTMAP_MAX=1
  -DVELA_LOW_MEMORY_SDKCONFIG=1
  -DVELA_FLASH_16MB=1

; 想启用 WROVER-E 的 PSRAM 时：
;   pio run -e yd_esp32_16mb -t menuconfig
;   → Component config → ESP32-specific → Support for external, SPI-connected RAM
; 打开后重新编译即可（本固件的关键缓冲都在内部 RAM，PSRAM 只是额外余量）。

